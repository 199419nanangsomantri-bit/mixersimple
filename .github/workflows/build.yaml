name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Buat folder android/ otomatis (karena kita tidak punya PC)
      - name: Buat kerangka Android
        run: flutter create --platforms=android --org com.example --project-name simplemixer .

      # Ganti manifest bawaan dengan manifest kita
      - name: Pasang AndroidManifest
        run: cp android_override/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      # Set minSdk = 23 (mendukung build.gradle maupun build.gradle.kts)
      - name: Atur minSdk
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle*
          grep -n "minSdk" android/app/build.gradle*

      - name: Ambil dependensi
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
