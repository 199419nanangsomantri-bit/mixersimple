name: simplemixer
description: Audio mixer sederhana
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Kalau build gagal karena versi tidak ditemukan,
  # buka pub.dev/packages/just_audio dan pub.dev/packages/file_picker,
  # ganti ke versi stable terbaru
  just_audio: ^0.9.40
  file_picker: ^8.1.2

flutter:
  uses-material-design: true
